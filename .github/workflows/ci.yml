name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, tests and schemas (PGlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run catalog:check

  postgres:
    name: Tests on Postgres 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rebbehub
          POSTGRES_PASSWORD: rebbehub
          POSTGRES_DB: rebbehub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rebbehub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REBBEHUB_TEST_DATABASE_URL: postgres://rebbehub:rebbehub@localhost:5432/rebbehub_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # One file at a time: the files share the test database.
      - run: npx vitest run --no-file-parallelism
