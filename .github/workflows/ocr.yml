name: Machine OCR

# Reads the served scans that have no machine text yet, page by page, with
# Tesseract (Hebrew), and adds each one's text as machine OCR: labelled as
# such on the site until people check it line by line (services/jobs/src/ocr.ts).
# Runs every night: the scans people asked for first (the site's "Read
# this scan" button, POST /v1/machine/requests, the ask_machine MCP tool,
# `rebbehub machine ask`), then the newest scans not read yet. When the API
# has GITHUB_DISPATCH_TOKEN, someone asking starts it at once for what was
# asked (requested: true). Free: Tesseract on the runner's CPU. Needs the
# DATABASE_URL repository secret, as the import does (docs/deploy.md).
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      requested:
        description: Only the scans people asked for (how the API starts it)
        type: boolean
        default: false
      steward:
        description: The steward who approves the machine's text
        default: shmuly
        required: true
      limit:
        description: How many scans to read this run
        default: "5"
        required: true

permissions:
  contents: read

# Every workflow that writes the live catalog (import, upkeep, network, ocr)
# shares one group, so they wait for each other: an import copies the catalog
# back only if nothing else changed it meanwhile (scripts/import-catalog.sh).
# GitHub keeps one waiting run per group; a newer one replaces it.
concurrency:
  group: catalog-production
  cancel-in-progress: false

jobs:
  ocr:
    name: Read scans
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # While RebbeHub is private, the jobs read the site with its key (services/jobs/src/privateKey.ts).
      REBBEHUB_PASSWORD: ${{ secrets.REBBEHUB_PASSWORD }}
    steps:
      - name: Check it is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Add the DATABASE_URL repository secret (see docs/deploy.md)."; exit 1; fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Tesseract (Hebrew) and Poppler
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-heb poppler-utils
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Read
        env:
          STEWARD: ${{ inputs.steward || 'shmuly' }}
          LIMIT: ${{ inputs.limit || '5' }}
          REQUESTED: ${{ inputs.requested }}
        run: |
          npm run rebbehub -- migrate
          args=(--approve-as "$STEWARD" --limit "$LIMIT")
          if [ "$REQUESTED" = "true" ]; then args+=(--requested-only); fi
          npm run rebbehub -- ocr "${args[@]}"
