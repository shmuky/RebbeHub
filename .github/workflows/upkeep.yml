name: Upkeep (manual)

# The catalog's upkeep after a deploy, one job a run, only when started
# (docs/deploy.md, "After a deploy"):
#
#   convert-bodies  turns pages whose words are still wiki markup into
#                   structured words, as reviewed system changes; once,
#                   after the redesign's schemas are deployed;
#   covers          each sefer's cover from its title page, into the public
#                   bucket; a PDF only linked (Drive, HebrewBooks) is
#                   fetched and kept in the preservation bucket, never served;
#   page-images     page images and thumbnails of served scans, into the
#                   public bucket (the viewer and the IIIF manifests);
#   relink-drive    links older imports stored on Sichos-Kodesh's media
#                   proxy, as the files' own Google Drive links: one bot
#                   suggestion of up to 500 items at a time, for review;
#   relink-drive-dry-run  only counts what relink-drive would change;
#   relink-jem      links to JEM's player in the older form, as the public
#                   Ashreinu app's own links to each recording, the same way;
#   relink-jem-dry-run  only counts what relink-jem would change;
#   shaars          every sefer without a shaar gets the one the catalog
#                   makes from its data (docs/shaar.md), labelled as the
#                   catalog's, as system changes of <limit> sefarim (500);
#   shaars-dry-run  only counts what shaars would change;
#   restore-word-times  word timings back for transcript paragraphs fixed
#                   before fixes kept them, from their history, as machine
#                   sync approved by shmuly (one suggestion per recording;
#                   limit: how many recordings, 50 by default);
#   restore-word-times-dry-run  only lists what restore-word-times would do.
#
# Needs the DATABASE_URL repository secret, as the import does; covers and
# page-images also CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN (a token
# with Workers R2 Storage: Edit, on rebbehub-public and rebbehub-preservation).
on:
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [convert-bodies, covers, page-images, relink-drive, relink-drive-dry-run, relink-jem, relink-jem-dry-run, restore-word-times, restore-word-times-dry-run, shaars, shaars-dry-run]
        default: covers
      limit:
        description: How many sefarim or scans this run (covers, page-images), or items per suggestion (relink-drive, relink-jem, shaars), or recordings (restore-word-times); empty for the command's own default
        required: false

permissions:
  contents: read

# Every workflow that writes the live catalog (import, upkeep, network, ocr)
# shares one group, so they wait for each other: an import copies the catalog
# back only if nothing else changed it meanwhile (scripts/import-catalog.sh).
# GitHub keeps one waiting run per group; a newer one replaces it.
concurrency:
  group: catalog-production
  cancel-in-progress: false

jobs:
  run:
    name: ${{ inputs.job }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # While RebbeHub is private, the jobs read the site with its key (services/jobs/src/privateKey.ts).
      REBBEHUB_PASSWORD: ${{ secrets.REBBEHUB_PASSWORD }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      JOB: ${{ inputs.job }}
      LIMIT: ${{ inputs.limit }}
    steps:
      - name: Check it is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Add the DATABASE_URL repository secret (see docs/deploy.md)."; exit 1; fi
          if [ "$JOB" != "convert-bodies" ] && [ "${JOB#relink-}" = "$JOB" ] && [ "${JOB#restore-}" = "$JOB" ] && [ "${JOB#shaars}" = "$JOB" ] && { [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; }; then
            echo "::error::Add the CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets (a token with Workers R2 Storage: Edit; see docs/deploy.md)."; exit 1
          fi
          if [ -n "$LIMIT" ] && ! [[ "$LIMIT" =~ ^[0-9]+$ ]]; then echo "::error::limit is a whole number, or empty."; exit 1; fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run
        run: |
          npm run rebbehub -- migrate
          case "$JOB" in
            convert-bodies)
              # Goes through every page still in markup; it takes no limit.
              npm run rebbehub -- convert-bodies
              ;;
            relink-drive|relink-drive-dry-run|relink-jem|relink-jem-dry-run|shaars|shaars-dry-run)
              # Sends all that is still on the proxy, a suggestion per <limit> items (500); what already waits in one is left to it.
              args=()
              if [ -n "$LIMIT" ]; then args+=(--chunk "$LIMIT"); fi
              if [ "${JOB%-dry-run}" != "$JOB" ]; then args+=(--dry-run); fi
              npm run rebbehub -- "${JOB%-dry-run}" "${args[@]}"
              ;;
            restore-word-times|restore-word-times-dry-run)
              args=(--limit "${LIMIT:-50}")
              if [ "$JOB" = "restore-word-times-dry-run" ]; then args+=(--dry-run); else args+=(--approve-as shmuly); fi
              npm run rebbehub -- restore-word-times "${args[@]}"
              ;;
            covers|page-images)
              if [ -n "$LIMIT" ]; then npm run rebbehub -- "$JOB" --limit "$LIMIT"; else npm run rebbehub -- "$JOB"; fi
              ;;
            *) echo "::error::Unknown job: $JOB"; exit 1 ;;
          esac
