# The public site on Cloudflare Workers, built and deployed by Cloudflare
# (Workers Builds) on every push to main; see docs/deploy.md.
name = "rebbehub-web"
main = "server/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

# Runs near the API and the database (Neon, Virginia) rather than near the reader: a page is
# made from many API reads one after the other, each a round trip. Built files (assets) and
# pages already at the edge are still served from near the reader (docs/operations.md).
[placement]
mode = "smart"

# build/client is served as static files before the Worker runs.
[assets]
directory = "build/client"

# The API, reached inside Cloudflare without a public round trip through this binding (API_URL is its
# public address, used only when the binding is absent): for what a page cannot answer itself, and for
# everything signed in.
[[services]]
binding = "API"
service = "rebbehub-api"

# A page's own reads are answered in this Worker by the API itself, over one connection to Postgres the page
# opens and closes (server/worker.ts; `readerFor` in services/api/src/reads.ts), so a page is one Worker
# invocation, not one and a dozen. Postgres on Neon through Hyperdrive: the same config as the API's.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "a06ec525cf9442f484f60ce9d38f0d39"

# The public bucket, for the status page's report and the texts of seforim (GET /v1/texts/<sha256>), and
# Sichos-Kodesh's published archive a sefer's text is first copied from: the API Worker's, read here too.
[[r2_buckets]]
binding = "FILES_PUBLIC"
bucket_name = "rebbehub-public"

[[r2_buckets]]
binding = "SK_ARCHIVE"
bucket_name = "sichos-kodesh-archive"

# Searches per address a minute on the site's own search (/search, and what the command palette asks):
# the API sees the site's requests as the site's, so the site counts them itself.
[[ratelimits]]
name = "RATE_LIMIT_SEARCH"
namespace_id = "1004"
simple = { limit = 60, period = 60 }

# Pages made for crawlers a minute, counted only when the edge has no copy (server/worker.ts, CachedSite): each
# search engine its own budget, all other bots (AI crawlers, SEO tools) one between them. Over it, a crawler is
# told 503 and to come back in two minutes. Each such page costs the database one to two dozen reads; on the
# paid plan (no daily allowance) the numbers keep one crawl from taking the database from readers: a search
# engine may have a page a second, all other bots ten a minute between them (docs/operations.md, "Crawlers").
[[ratelimits]]
name = "RATE_LIMIT_CRAWL_SEARCH"
namespace_id = "1101"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RATE_LIMIT_CRAWL"
namespace_id = "1102"
simple = { limit = 10, period = 60 }

# Cloudflare's Workers cache (docs/operations.md, "Traffic and crawlers"). The default entrypoint runs on
# every request and is never cached: it sends pages for someone not signed in on to CachedSite, which the
# cache sits in front of (pages say how long in their Cache-Control: root.tsx). server/worker.ts.
[exports.default]
type = "worker"

[exports.default.cache]
enabled = false

[exports.CachedSite]
type = "worker"

[exports.CachedSite.cache]
enabled = true

[vars]
API_URL = "https://api.rebbehub.org"
# The site's public address, for canonical links and sitemaps.
SITE_URL = "https://rebbehub.org"
