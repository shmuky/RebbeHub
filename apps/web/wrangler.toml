# The public site on Cloudflare Workers, built and deployed by Cloudflare
# (Workers Builds) on every push to main; see docs/deploy.md.
name = "rebbehub-web"
main = "server/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

# Runs near the API and the database (Neon, Virginia) rather than near the reader: a page is
# made from many API reads one after the other, each a round trip. Built files (assets) and
# pages already at the edge are still served from near the reader (docs/operations.md).
[placement]
mode = "smart"

# build/client is served as static files before the Worker runs.
[assets]
directory = "build/client"

# The API, reached inside Cloudflare without a public round trip through this binding (API_URL is its
# public address, used only when the binding is absent).
[[services]]
binding = "API"
service = "rebbehub-api"

# Searches per address a minute on the site's own search (/search, and what the command palette asks):
# the API sees the site's requests as the site's, so the site counts them itself.
[[ratelimits]]
name = "RATE_LIMIT_SEARCH"
namespace_id = "1004"
simple = { limit = 60, period = 60 }

# Cloudflare's Workers cache (docs/operations.md, "Traffic and crawlers"). The default entrypoint runs on
# every request and is never cached: it sends pages for someone not signed in on to CachedSite, which the
# cache sits in front of (pages say how long in their Cache-Control: root.tsx). server/worker.ts.
[exports.default]
type = "worker"

[exports.default.cache]
enabled = false

[exports.CachedSite]
type = "worker"

[exports.CachedSite.cache]
enabled = true

[vars]
API_URL = "https://api.rebbehub.org"
# The site's public address, for canonical links and sitemaps.
SITE_URL = "https://rebbehub.org"
