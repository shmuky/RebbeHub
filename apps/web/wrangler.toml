# The public site on Cloudflare Workers, built and deployed by Cloudflare
# (Workers Builds) on every push to main; see docs/deploy.md.
name = "rebbehub-web"
main = "server/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

# build/client is served as static files before the Worker runs.
[assets]
directory = "build/client"

# The API, reached inside Cloudflare without a public round trip through this binding (API_URL is its
# public address, used only when the binding is absent).
[[services]]
binding = "API"
service = "rebbehub-api"

[vars]
API_URL = "https://api.rebbehub.org"
# The site's public address, for canonical links and sitemaps.
SITE_URL = "https://rebbehub.org"
